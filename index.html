<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faf8"><title>My Fitness Log</title><style>body{margin:0;background:#f3f7f5;color:#193b30;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:5px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#6c8178;font-size:12px}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0b49300b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats .card{margin:8px 0}.big{font-size:29px;font-weight:750}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:16px 0}button{border:0;background:#e4eee8;color:#205744;padding:11px 8px;border-radius:12px;font-weight:650}button.active,.primary{background:#1e7558;color:white}label{display:block;font-size:13px;color:#456357;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cddbd3;border-radius:11px;padding:12px;font-size:16px;background:#fff;color:#163e2e}input[type=date]{min-height:44px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.entry{padding:10px 0;border-bottom:1px solid #e8eee9;font-size:14px}.entry:last-child{border-bottom:0}.entry small{display:block;color:#6b8075;margin-top:4px}canvas{width:100%;height:180px}p{line-height:1.65}.danger{color:#a44444}.foot{font-size:12px;color:#6c8178}#notice{color:#1e7558;font-size:13px;margin:10px 0}#file{display:none}</style></head><body><main><header><div><div class="muted">あなた専用の健康ログ</div><h1>🌿 My Fitness Log</h1></div><div>💪</div></header><div class="stats"><div class="card"><div class="muted">最新の体重</div><div class="big" id="latest">—</div><div class="muted" id="delta">—</div></div><div class="card"><div class="muted">目標（仮）60.0kg まで</div><div class="big" id="remaining">—</div><div class="muted">目標値は仮設定です</div></div></div><nav><button data-tab="weight" class="active">⚖️ 体重</button><button data-tab="training">🏋️ 運動</button><button data-tab="food">🍚 食事</button><button data-tab="condition">💧 体調</button></nav><div id="content"></div><div class="card"><h2>💬 チャッピーに報告</h2><p class="foot">日付を選んで「報告文をコピー」。このチャットに貼り付けて送信してね。自動送信はしません。</p><label>報告する日付</label><input id="reportDate" type="date"><button class="primary" style="width:100%;margin-top:12px" onclick="copyReport()">📋 報告文をコピー</button><div id="reportStatus" class="foot" style="margin-top:8px" aria-live="polite"></div><textarea id="reportFallback" rows="9" style="display:none;margin-top:10px" readonly></textarea></div><div class="card"><h2>🔐 データの保存</h2><p class="foot">記録はこの端末のブラウザ内に保存されます。別端末への自動同期はありません。機種変更やデータ消去に備えて定期的にバックアップしてください。</p><div class="grid"><button onclick="backup()">⬇ バックアップ</button><button onclick="document.getElementById('file').click()">⬆ 復元</button></div><input type="file" id="file" accept="application/json" onchange="restore(event)"><div id="notice"></div></div><p class="foot">このアプリは記録用の試作品です。ChatGPTへの自動送信やヘルスケアとの連携はありません。痛み・強い疲労がある日は運動を控えてください。</p></main><script>
const KEY='myfitnesslog_v1';const DEFAULT_MACHINES=['レッグプレス','ヒップアダクター','ヒップアブダクター','腹筋マシン','チェストプレス','シーテッドロー','レッグエクステンション','ウォーキング','ウォームアップ','その他'];const initial={weights:[],undated:[],training:[],food:[],condition:[],machines:[...DEFAULT_MACHINES]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){data=structuredClone(initial)};if(!Array.isArray(data.machines)){data.machines=[...new Set([...DEFAULT_MACHINES,...(data.training||[]).map(x=>x.name).filter(Boolean)])]}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}const today=()=>new Date().toLocaleDateString('sv-SE');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='weight';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});function weekly(){const m={};data.weights.forEach(x=>{const d=new Date(x.date+'T12:00:00');if(isNaN(d))return;const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);const key=d.toLocaleDateString('sv-SE');(m[key]??=[]).push(Number(x.value))});return Object.keys(m).sort().map(k=>({week:k,avg:m[k].reduce((a,b)=>a+b,0)/m[k].length,n:m[k].length}))}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const w=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date));const last=w.at(-1),prev=w.at(-2);document.getElementById('latest').textContent=last?last.value.toFixed(2)+'kg':'—';document.getElementById('remaining').textContent=last?Math.max(0,last.value-60).toFixed(2)+'kg':'—';document.getElementById('delta').textContent=prev?'前回比 '+(last.value-prev.value>0?'+':'')+(last.value-prev.value).toFixed(2)+'kg':'記録待ち';const el=document.getElementById('content');if(tab==='weight'){const weeks=weekly();el.innerHTML=`<div class="card"><h2>📈 体重推移</h2><canvas id="chart" width="520" height="180"></canvas><p class="foot">日付が確定している記録のみ表示。日付不明の過去6件は下に別記。</p><div class="grid"><div><label>日付</label><input id="wd" type="date" value="${today()}"></div><div><label>体重（kg）</label><input id="wv" type="number" step="0.01" min="20" max="300" placeholder="例：65.5"></div></div><button class="primary" style="width:100%;margin-top:12px" onclick="addWeight()">＋ 体重を記録</button></div><div class="card"><h2>📅 週平均（月〜日）</h2>${weeks.map((x,i)=>`<div class="entry">${esc(x.week)} の週：<b>${x.avg.toFixed(2)}kg</b> <small>${x.n}日分・前週差 ${i===0?'比較不可':(x.avg-weeks[i-1].avg>0?'+':'')+(x.avg-weeks[i-1].avg).toFixed(2)+'kg'}（測定日の偏りに注意）</small></div>`).join('')||'記録なし'}</div><div class="card"><h2>📚 日付不明の過去記録</h2><p>${data.undated.join(' → ')} kg</p><p class="foot">10/1などの日付は推測で付けていません。</p><h2>日付付きの体重</h2>${w.slice().reverse().map(x=>`<div class="entry">${esc(x.date)}：${x.value}kg <button style="float:right;padding:4px 9px" onclick="removeWeight('${esc(x.date)}')">削除</button></div>`).join('')}</div>`;draw(w)}else if(tab==='training'){el.innerHTML=`<div class="card"><h2>🏋️ トレーニングを追加</h2><label>日付</label><input type="date" id="td" value="${today()}"><label>種目</label><select id="tn">${data.machines.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><details style="margin:12px 0;border:1px solid #dce8e0;border-radius:12px;padding:12px"><summary style="cursor:pointer;font-weight:700">⚙️ マシンを追加・編集</summary><p class="foot">新しいマシンを登録すると次回から選べます。名前を変更・削除しても、過去の運動記録はそのまま残ります。</p><label>新しいマシン名</label><div style="display:flex;gap:8px"><input id="newMachine" maxlength="60" placeholder="例：ラットプルダウン"><button type="button" onclick="addMachine()">＋追加</button></div><div style="margin-top:10px">${data.machines.map((n,i)=>`<div class="entry" style="display:flex;align-items:center;gap:6px"><span style="flex:1;overflow-wrap:anywhere">${esc(n)}</span><button type="button" onclick="renameMachine(${i})">名前変更</button><button type="button" onclick="deleteMachine(${i})">削除</button></div>`).join('')}</div></details><div class="grid3"><div><label>重量kg</label><input type="number" id="tw" step="0.1" min="0"></div><div><label>回数</label><input type="number" id="tr" min="0"></div><div><label>セット</label><input type="number" id="ts" min="0"></div></div><label>有酸素の時間・速度・傾斜／メモ</label><textarea id="tmsg" rows="2" placeholder="40分、4km/h、傾斜2% など"></textarea><button class="primary" style="width:100%;margin-top:12px" onclick="addTraining()">＋ 運動を記録</button></div><div class="card"><h2>📋 運動履歴</h2>${[...data.training].reverse().map((x,i)=>`<div class="entry"><b>${esc(x.name)}</b> <span class="muted">${esc(x.date)}</span><small>${x.weight!=null?x.weight+'kg × '+x.reps+'回 × '+x.sets+'セット':''} ${esc(x.note||'')}</small></div>`).join('')}</div>`}else if(tab==='food'){el.innerHTML=`<div class="card"><h2>🍚 食事を記録</h2><label>日付</label><input type="date" id="fd" value="${today()}"><label>食事</label><select id="fm"><option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option><option>ジム前</option></select><label>食べたもの・量</label><textarea id="fn" rows="3" placeholder="ご飯80g、納豆1パックなど"></textarea><button class="primary" style="width:100%;margin-top:12px" onclick="addFood()">＋ 食事を記録</button></div><div class="card"><h2>📋 食事履歴</h2>${[...data.food].reverse().map(x=>`<div class="entry"><b>${esc(x.meal)}</b> <span class="muted">${esc(x.date)}</span><small>${esc(x.note)}</small></div>`).join('')}</div>`}else{el.innerHTML=`<div class="card"><h2>💧 体調を記録</h2><label>日付</label><input type="date" id="cd" value="${today()}"><div class="grid"><div><label>腰の状態</label><select id="cb"><option>なし</option><option>違和感あり</option><option>痛みあり</option></select></div><div><label>疲労</label><select id="cf"><option>なし</option><option>軽い</option><option>強い</option></select></div><div><label>飲み物（ml）</label><input id="cw" type="number" min="0" placeholder="1500"></div><div><label>歩数</label><input id="cs" type="number" min="0" placeholder="6000"></div></div><label>メモ（便通・睡眠など）</label><textarea id="cn" rows="2"></textarea><button class="primary" style="width:100%;margin-top:12px" onclick="addCondition()">＋ 体調を記録</button></div><div class="card"><h2>📋 体調履歴</h2>${[...data.condition].reverse().map(x=>`<div class="entry"><b>${esc(x.date)}</b><small>腰：${esc(x.back)}／疲労：${esc(x.fatigue)}／水分：${esc(x.water||'未記録')}ml／歩数：${esc(x.steps||'未記録')}<br>${esc(x.note)}</small></div>`).join('')}</div>`}}function addWeight(){const d=document.getElementById('wd').value,v=Number(document.getElementById('wv').value);if(!d||!v||v<20||v>300)return alert('日付と体重を確認してね');data.weights=data.weights.filter(x=>x.date!==d);data.weights.push({date:d,value:v});save()}function removeWeight(d){if(confirm(d+' の体重を削除しますか？')){data.weights=data.weights.filter(x=>x.date!==d);save()}}function addMachine(){const input=document.getElementById('newMachine');const n=input.value.trim();if(!n)return alert('マシン名を入力してね');if(data.machines.includes(n))return alert('同じ名前のマシンが登録済みだよ');data.machines.push(n);save();document.getElementById('tn').value=n;alert('マシンを追加したよ！')}function renameMachine(i){const before=data.machines[i];if(before==null)return;const after=prompt('新しいマシン名を入力してね（過去の記録は変更しません）',before);if(after===null)return;const n=after.trim();if(!n)return alert('空の名前にはできないよ');if(n!==before&&data.machines.includes(n))return alert('同じ名前が登録済みだよ');data.machines[i]=n;save()}function deleteMachine(i){const n=data.machines[i];if(n==null)return;if(!confirm('「'+n+'」を選択肢から削除しますか？ 過去の記録は残ります。'))return;data.machines.splice(i,1);save()}function addTraining(){const name=document.getElementById('tn').value,w=document.getElementById('tw').value,r=document.getElementById('tr').value,s=document.getElementById('ts').value,n=document.getElementById('tmsg').value;if(!n&&(!w||!r||!s))return alert('重量・回数・セット数、または運動メモを入力してね');data.training.push({date:document.getElementById('td').value,name,weight:w===''?null:Number(w),reps:r===''?null:Number(r),sets:s===''?null:Number(s),note:n});save()}function addFood(){const n=document.getElementById('fn').value.trim();if(!n)return alert('食事内容を入力してね');data.food.push({date:document.getElementById('fd').value,meal:document.getElementById('fm').value,note:n});save()}function addCondition(){data.condition.push({date:document.getElementById('cd').value,back:document.getElementById('cb').value,fatigue:document.getElementById('cf').value,water:document.getElementById('cw').value,steps:document.getElementById('cs').value,note:document.getElementById('cn').value});save()}function draw(w){const c=document.getElementById('chart');if(!c||!w.length)return;const ctx=c.getContext('2d'),W=c.width,H=c.height,p=35;ctx.clearRect(0,0,W,H);const vals=w.map(x=>x.value),min=Math.floor((Math.min(...vals)-.25)*2)/2,max=Math.ceil((Math.max(...vals)+.25)*2)/2,range=max-min||1;ctx.font='12px sans-serif';ctx.fillStyle='#728a7d';ctx.strokeStyle='#e3eee6';for(let i=0;i<4;i++){const y=p+(H-2*p)*i/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(W-p,y);ctx.stroke();ctx.fillText((max-range*i/3).toFixed(1),1,y+4)}ctx.strokeStyle='#1d7a59';ctx.lineWidth=3;ctx.beginPath();w.forEach((x,i)=>{const xx=p+(W-2*p)*(w.length===1?.5:i/(w.length-1)),yy=p+(max-x.value)/range*(H-2*p);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();w.forEach((x,i)=>{const xx=p+(W-2*p)*(w.length===1?.5:i/(w.length-1)),yy=p+(max-x.value)/range*(H-2*p);ctx.fillStyle='#1d7a59';ctx.beginPath();ctx.arc(xx,yy,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#728a7d';ctx.fillText(x.date.slice(5).replace('-','/'),xx-15,H-8)})}function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fitness-log-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(e){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.weights)||!Array.isArray(d.training)||!Array.isArray(d.food)||!Array.isArray(d.condition))throw Error();if(!confirm('現在の記録をバックアップデータで置き換えますか？'))return;data=d;if(!Array.isArray(data.machines))data.machines=[...new Set([...DEFAULT_MACHINES,...(data.training||[]).map(x=>x.name).filter(Boolean)])];save();document.getElementById('notice').textContent='復元しました'}catch(err){alert('正しいバックアップファイルではありません')}};rd.readAsText(f)}function buildReport(date){const weights=data.weights.filter(x=>x.date===date);const training=data.training.filter(x=>x.date===date);const food=data.food.filter(x=>x.date===date);const condition=data.condition.filter(x=>x.date===date);const lines=['【My Fitness Log｜'+date+'】','体重：'+(weights.length?weights.at(-1).value+'kg':'未記録'),'','■ 運動'];if(training.length){training.forEach(x=>lines.push('・'+x.name+'：'+(x.weight!=null?x.weight+'kg × '+x.reps+'回 × '+x.sets+'セット':'')+(x.note?' '+x.note:'')))}else lines.push('未記録');lines.push('','■ 食事');if(food.length){food.forEach(x=>lines.push('・'+x.meal+'：'+x.note))}else lines.push('未記録');lines.push('','■ 体調');if(condition.length){const x=condition.at(-1);lines.push('腰：'+(x.back||'未記録'),'疲労：'+(x.fatigue||'未記録'),'水分：'+(x.water?x.water+'ml':'未記録'),'歩数：'+(x.steps?x.steps+'歩':'未記録'));if(x.note)lines.push('メモ：'+x.note)}else lines.push('未記録');lines.push('','記録内容を確認し、必要に応じて次の運動メニューと食事のアドバイスをお願いします。');return lines.join('\n')}async function copyReport(){const date=document.getElementById('reportDate').value;if(!date)return alert('報告する日付を選んでね');const report=buildReport(date);const status=document.getElementById('reportStatus');const fallback=document.getElementById('reportFallback');try{await navigator.clipboard.writeText(report);status.textContent='コピーできたよ！ChatGPTのこのチャットを開いて貼り付けてね。';fallback.style.display='none'}catch(e){fallback.value=report;fallback.style.display='block';fallback.focus();fallback.select();status.textContent='自動コピーが使えない場合は、下の文章を長押しして「コピー」を選んでね。'}}document.getElementById('reportDate').value=today();render();</script></body></html>
